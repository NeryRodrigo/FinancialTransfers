services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: financial-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Password123", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: financial-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: financial-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  payment-api:
    build:
      context: .
      dockerfile: FinancialTransfers.API/Dockerfile
    container_name: financial-payment-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TransfersDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy

  risk-engine:
    build:
      context: .
      dockerfile: FinancialTransfers.RiskEngine/Dockerfile
    container_name: financial-risk-engine
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TransfersDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy